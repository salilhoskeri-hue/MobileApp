name: Android build

on:
  push:
    branches-ignore:
      - "screenshots*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"

          echo "::group::Signature"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "::endgroup::"

          echo "::group::Package info"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|uses-permission)"
          echo "::endgroup::"

          echo "::group::Permissions"
          "$BT/aapt2" dump permissions "$APK" | tee permissions.txt
          echo "::endgroup::"

          # The app should request nothing beyond the signature-level permission
          # that androidx.core adds for its own internal broadcast receivers.
          unexpected=$(grep -E "^uses-permission" permissions.txt \
            | grep -v "com.supplytrack.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected permissions requested:"
            echo "$unexpected"
            exit 1
          fi

          {
            echo "### APK validation"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Size: $(du -h "$APK" | cut -f1)"
            echo "- Signature: verified"
            echo "- Permissions requested: none beyond the app's internal signature permission"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SupplyTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Every green build of main replaces the "latest" release, so the newest
      # APK is always one click away on the repo's Releases page.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SupplyTrack-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SupplyTrack-debug.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "SupplyTrack - latest build" \
            --notes "Debug build of \`main\` at commit ${GITHUB_SHA::7}, updated automatically after every merge.

          **Install:** download \`SupplyTrack-debug.apk\` below and open it on an Android 8.0+ phone or emulator (allow installs from unknown sources), or drag it onto an Android Studio emulator window.

          This is a debug build signed with a test key, for trying the app. It requests no permissions."

  ui-test:
    name: UI walkthrough (Android ${{ matrix.android }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - android: "14"
            api-level: 34
            branch: screenshots
          - android: "16"
            api-level: 36
            branch: screenshots-android-16
          - android: "17"
            # Android 17's SDK packages are published as "android-37.0".
            api-level: "37.0"
            branch: screenshots-android-17
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installed and run by hand (not connectedAndroidTest) so the app stays
      # installed afterwards and its screenshots can be pulled off the device.
      - name: Run walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          system-image-api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell am instrument -w com.supplytrack.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            adb exec-out run-as com.supplytrack.app tar c files/screenshots > screenshots.tar || true
            grep -q "OK (" instrument.txt

      - name: Unpack screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -s screenshots.tar ]; then tar xf screenshots.tar -C screenshots --strip-components=2; fi
          ls -l screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SupplyTrack-screenshots-android-${{ matrix.android }}
          path: screenshots/
          if-no-files-found: ignore

      # Also publish them to a branch (screenshots, screenshots-android-16, ...)
      # so they can be browsed on GitHub.
      - name: Publish screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          cd screenshots
          ls ./*.png >/dev/null 2>&1 || { echo "No screenshots captured"; exit 0; }
          {
            echo "# SupplyTrack screenshots"
            echo
            echo "Captured on an Android ${{ matrix.android }} emulator (Pixel 6, API ${{ matrix.api-level }}) by the UI walkthrough test,"
            echo "commit ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`."
            echo
            for f in *.png; do
              echo "### ${f%.png}"
              echo
              echo "<img src=\"$f\" width=\"300\">"
              echo
            done
          } > README.md
          git init -q -b "${{ matrix.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "${{ matrix.branch }}"
